<!doctype html>
<!-- lang="ru": интерфейс на русском. С прежним lang="en" Chrome считал
     страницу английской и АВТО-переводил en→ru, оборачивая текст в свои теги
     и ломая live-обновления React (прыгающий индикатор, пробел, текст «резко
     вылетает»). translate="no" + meta notranslate явно запрещают автоперевод. -->
<html lang="ru" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>Vels Claude Light</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
