<!doctype html>
<!-- lang="ru": интерфейс на русском. С прежним lang="en" Chrome считал
     страницу английской и АВТО-переводил en→ru, оборачивая текст в свои теги
     и ломая live-обновления React (прыгающий индикатор, пробел, текст «резко
     вылетает»). translate="no" + meta notranslate явно запрещают автоперевод. -->
<html lang="ru" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>AI-Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
