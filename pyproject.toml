[project]
name = "telegram-claude-code"
version = "0.1.0"
description = "Telegram bot interface for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "SQLAlchemy[asyncio]>=2.0.0",
    "aiofiles>=23.0.0",
    "structlog>=24.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    # E2E web tests (tests/integration/web/test_apikey_ui.py). Requires a
    # browser binary: `python -m playwright install chromium`. Tests skip
    # cleanly when Playwright or the browser is absent.
    "pytest-playwright>=0.5.0",
]

# `ai-panel` CLI: узнать адрес веб-платформы и статус сервиса.
# Доступна после `pip install -e .`; без установки — `python -m src.cli url`.
[project.scripts]
ai-panel = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
